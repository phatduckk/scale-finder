const NOTE_TO_IDX = {
  'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,
  'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11
};

// Guitar string open notes (low E to high e)
const TAB_STRINGS = {
  'E':4, 'A':9, 'D':2, 'G':7, 'B':11, 'e':4
};

// Curated display order for the "<Note>'s Chords" reference section — most
// commonly used qualities first.
const CHORD_DISPLAY_ORDER = ['maj','m','7','maj7','m7','dim','aug','sus2','sus4','add9','m9','dim7','m7b5','mM7','madd9','9','5'];

function chordIntervalRole(iv) {
  const semis = iv % 12;
  if (semis === 0) return 'root';
  if (semis === 3 || semis === 4) return 'third';
  if (semis === 6 || semis === 7 || semis === 8) return 'fifth';
  return 'scale'; // 2nd/7th/9th — no dedicated accent color, shown neutral
}

function buildChordCard(root, quality) {
  const ivs = CHORD_INTERVALS[quality];
  if (!ivs) return '';
  const rootName = noteName(root);
  const suffix = quality === 'maj' ? '' : quality;
  let pills = '';
  for (const iv of ivs) {
    const ni = (root + iv) % 12;
    const role = chordIntervalRole(iv);
    const cls = role === 'scale' ? 'snote scale' : `snote triad-${role}`;
    pills += `<div class="${cls}">${noteName(ni)}</div>`;
  }
  return `
  <div class="scale-card" onclick="openChordModal(${root}, '${quality}')">
    <div class="scale-card-hdr">
      <span class="scale-root">${rootName}${suffix}</span>
      <span class="scale-count">${ivs.length} notes</span>
    </div>
    <div class="note-row">${pills}</div>
  </div>`;
}

const CHORD_INTERVALS = {
  'maj':   [0,4,7],
  'm':     [0,3,7],
  '5':     [0,7],
  'dim':   [0,3,6],
  'aug':   [0,4,8],
  '7':     [0,4,7,10],
  'maj7':  [0,4,7,11],
  'm7':    [0,3,7,10],
  'mM7':   [0,3,7,11],
  'm7b5':  [0,3,6,10],
  'dim7':  [0,3,6,9],
  'sus2':  [0,2,7],
  'sus4':  [0,5,7],
  'add9':  [0,2,4,7],
  'madd9': [0,2,3,7],
  '9':     [0,4,7,10,14],
  'm9':    [0,3,7,10,14],
};

const CHORD_LABELS = {
  'maj': 'Major', 'm': 'Minor', '5': 'Power Chord', 'dim': 'Diminished', 'aug': 'Augmented',
  '7': 'Dominant 7th', 'maj7': 'Major 7th', 'm7': 'Minor 7th', 'mM7': 'Minor-Major 7th',
  'm7b5': 'Half-Diminished (m7♭5)', 'dim7': 'Diminished 7th', 'sus2': 'Sus2', 'sus4': 'Sus4',
  'add9': 'Add9', 'madd9': 'Minor Add9', '9': 'Dominant 9th', 'm9': 'Minor 9th',
};

// ── REAL CHORD VOICINGS ──────────────────────────────────────────────────────
//
// Fret-per-string shapes (low E to high e; 'x' = muted, 0 = open), for the
// qualities where a single well-known guitar shape exists. Every shape below
// was checked against CHORD_INTERVALS by computing each string's actual
// sounding pitch class — not eyeballed from a chart — so they're guaranteed
// to contain exactly the right notes.
//
// E_SHAPE / A_SHAPE are the classic movable "barre" templates (root on the
// low E string / A string respectively, at fret 0 = open position). For any
// other root the same finger pattern just slides up by however many frets
// that root sits above E (or above A) — whichever is the lower position.
const E_SHAPE = {
  maj:   [0,2,2,1,0,0],
  m:     [0,2,2,0,0,0],
  '7':   [0,2,0,1,0,0],
  maj7:  [0,2,1,1,0,0],
  m7:    [0,2,0,0,0,0],
  sus4:  [0,2,2,2,0,0],
  sus2:  [0,2,4,4,0,0],
  '5':   [0,2,2,'x','x','x'],
  dim:   [0,1,2,0,'x',0],
  aug:   [0,3,2,1,1,0],
  dim7:  [0,1,2,0,2,0],
  m7b5:  [0,1,0,0,3,0],
  mM7:   [0,2,1,0,0,0],
  add9:  [0,2,4,1,0,0],
  madd9: [0,2,4,0,0,0],
  '6':   [0,2,2,1,2,0],
  m6:    [0,2,2,0,2,0],
  '9':   [0,2,0,1,3,2],
  m9:    [0,2,0,0,3,2],
};
const A_SHAPE = {
  maj:   ['x',0,2,2,2,0],
  m:     ['x',0,2,2,1,0],
  '7':   ['x',0,2,0,2,0],
  maj7:  ['x',0,2,1,2,0],
  m7:    ['x',0,2,0,1,0],
  sus4:  ['x',0,2,2,3,0],
  sus2:  ['x',0,2,2,0,0],
  '5':   ['x',0,2,'x','x','x'],
  dim:   ['x',0,1,2,1,'x'],
  aug:   ['x',0,3,2,2,1],
  dim7:  ['x',0,1,2,1,2],
  m7b5:  ['x',0,1,0,1,3],
  mM7:   ['x',0,2,1,1,0],
  add9:  ['x',0,2,4,2,0],
  madd9: ['x',0,2,4,1,0],
  '6':   ['x',0,2,2,2,2],
  m6:    ['x',0,2,2,1,2],
  '9':   ['x',4,2,0,0,5],
  m9:    ['x',3,2,0,0,5],
};
// A few classic open-position shapes that are more idiomatic than the movable
// templates above for these specific roots — every guitarist's first chords.
const OPEN_CHORD_SHAPES = {
  4:  { maj:[0,2,2,1,0,0], m:[0,2,2,0,0,0], '7':[0,2,0,1,0,0], maj7:[0,2,1,1,0,0], m7:[0,2,0,0,0,0], sus4:[0,2,2,2,0,0] }, // E
  9:  { maj:['x',0,2,2,2,0], m:['x',0,2,2,1,0], '7':['x',0,2,0,2,0], maj7:['x',0,2,1,2,0], m7:['x',0,2,0,1,0], sus4:['x',0,2,2,3,0], sus2:['x',0,2,2,0,0] }, // A
  2:  { maj:['x','x',0,2,3,2], m:['x','x',0,2,3,1], '7':['x','x',0,2,1,2], maj7:['x','x',0,2,2,2], m7:['x','x',0,2,1,1], sus4:['x','x',0,2,3,3] }, // D
  7:  { maj:[3,2,0,0,0,3], '7':[3,2,0,0,0,1], maj7:[3,2,0,0,0,2] }, // G
  0:  { maj:['x',3,2,0,1,0], '7':['x',3,2,3,1,0], maj7:['x',3,2,0,0,0] }, // C
  11: { '7':['x',2,1,2,0,2] }, // B
};

// Returns { frets, startFret } for a root+quality we have a verified shape
// for, or null if this quality isn't one of them (caller should fall back to
// the derived fretboard-position view instead of guessing).
function getChordVoicing(root, quality) {
  const openShape = OPEN_CHORD_SHAPES[root] && OPEN_CHORD_SHAPES[root][quality];
  if (openShape) return { frets: openShape, startFret: 0 };

  if (!E_SHAPE[quality]) return null;
  const rootFretE = (root - 4 + 12) % 12;
  const rootFretA = (root - 9 + 12) % 12;
  const useE = rootFretE <= rootFretA;
  const rootFret = useE ? rootFretE : rootFretA;
  const template = useE ? E_SHAPE[quality] : A_SHAPE[quality];
  const frets = template.map(v => v === 'x' ? 'x' : v + rootFret);
  return { frets, startFret: rootFret };
}

function chordToNotes(token) {
  // Strict: uppercase root only, must consume full token (no trailing junk like "Chords")
  const m = token.match(/^([A-G][#b]?)(m7b5|mM7|maj7|m7|dim7|dim|aug|sus2|sus4|madd9|add9|m9|m|5|7|9)?$/);
  if (!m) return null;
  const root = NOTE_TO_IDX[m[1]];
  if (root === undefined) return null;
  const quality = m[2] || 'maj';
  const ivs = CHORD_INTERVALS[quality] || CHORD_INTERVALS['maj'];
  return { notes: ivs.map(iv => (root + iv) % 12), root, quality };
}

function parseChords(text) {
  const found = new Set();
  const rootFreq = new Map();
  const rootQualFreq = new Map(); // rootIdx → Map(quality → count)
  let firstRoot = null;
  for (const token of text.split(/[\s,|()\[\]\/\-\\]+/)) {
    const result = chordToNotes(token);
    if (!result) continue;
    const { notes, root, quality } = result;
    notes.forEach(n => found.add(n));
    if (firstRoot === null) firstRoot = root;
    rootFreq.set(root, (rootFreq.get(root) || 0) + 1);
    if (!rootQualFreq.has(root)) rootQualFreq.set(root, new Map());
    const qm = rootQualFreq.get(root);
    qm.set(quality, (qm.get(quality) || 0) + 1);
  }
  // Pick the dominant non-maj quality per root
  const rootQuality = new Map();
  for (const [root, qm] of rootQualFreq) {
    let bestQ = null, bestCount = 0;
    for (const [q, count] of qm) {
      if (q !== 'maj' && count > bestCount) { bestQ = q; bestCount = count; }
    }
    if (bestQ) rootQuality.set(root, bestQ);
  }
  // Explicit key signature wins over first-chord heuristic
  const keyMatch = text.match(/\bkey[:\s]+([A-G][#b]?)\s*(minor|major|min|maj)?\b/i);
  if (keyMatch) {
    const keyRoot = NOTE_TO_IDX[keyMatch[1]];
    if (keyRoot !== undefined) firstRoot = keyRoot;
  }
  return { notes: found, rootFreq, firstRoot, rootQuality };
}

function parseTabs(text) {
  const found = new Set();
  // Match lines like:  e|--0--3--5--|  or  E |--0--3--|
  const tabLine = /^([EADGBe])\s*\|([^\n]+)/gm;
  let m;
  while ((m = tabLine.exec(text)) !== null) {
    const stringLabel = m[1];
    const open = TAB_STRINGS[stringLabel];
    if (open === undefined) continue;
    // Extract all fret numbers from this line
    for (const fret of m[2].matchAll(/\d+/g)) {
      found.add((open + parseInt(fret[0])) % 12);
    }
  }
  return found;
}

function applyImportedNotes({ notes, rootFreq, firstRoot = null, rootQuality = new Map() }) {
  if (notes.size === 0) { alert('No recognizable notes or chords found in this file.'); return; }
  chordRootFreq = rootFreq;
  firstChordRoot = firstRoot;
  appliedChords.clear();
  for (const [root, quality] of rootQuality) {
    if (POPOVER_CHORDS.includes(quality)) appliedChords.set(root, quality);
  }
  sel.clear();
  notes.forEach(n => sel.add(n));
  refreshButtons();
  analyze();
}


async function extractPdfText(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data = await file.arrayBuffer();
  const pdf  = await pdfjsLib.getDocument({ data }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page    = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

document.getElementById('file-import').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  let text;
  if (file.name.endsWith('.pdf')) {
    text = await extractPdfText(file);
  } else {
    text = await file.text();
  }

  // Try tab notation first (more specific); fall back to chord names
  const tabNotes = parseTabs(text);
  if (tabNotes.size > 0) {
    applyImportedNotes({ notes: tabNotes, rootFreq: new Map() });
  } else {
    applyImportedNotes(parseChords(text));
  }
});

// ── STORAGE ───────────────────────────────────────────────────────────────────

const IS_SERVED = window.location.protocol !== 'file:';
const API = 'http://localhost:3001/api';

// localStorage helpers
function lsGetSongs() {
  return JSON.parse(localStorage.getItem('sf_songs') || '[]');
}
function lsSetSongs(songs) {
  localStorage.setItem('sf_songs', JSON.stringify(songs));
}
function lsGetSettings() {
  return JSON.parse(localStorage.getItem('sf_settings') || '{}');
}
// Mirrors the server's uniqueName() — appends " 2", " 3", etc. until the name
// isn't taken by any song (trashed or not, matching the DB's UNIQUE constraint).
function lsUniqueName(base, excludeId) {
  const all = lsGetSongs();
  let name = base, n = 2;
  while (all.some(s => s.name === name && s.id !== excludeId)) { name = `${base} ${n}`; n++; }
  return name;
}

async function fetchSongs() {
  if (!IS_SERVED) return lsGetSongs().filter(s => !s.trashed_at);
  const res = await fetch(`${API}/songs`);
  return res.json();
}

async function fetchTrash() {
  if (!IS_SERVED) return lsGetSongs().filter(s => s.trashed_at);
  const res = await fetch(`${API}/songs/trash`);
  return res.json();
}

async function saveSong(name, notes, scales) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const song = { id: Date.now(), name: lsUniqueName(name), notes, scales, created_at: new Date().toISOString(), trashed_at: null };
    lsSetSongs([song, ...songs]);
    return song;
  }
  const res = await fetch(`${API}/songs`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, notes, scales }),
  });
  if (!res.ok) throw new Error('save failed');
  return res.json();
}

async function deleteSong(id) {
  if (!IS_SERVED) {
    lsSetSongs(lsGetSongs().filter(s => s.id !== id));
    return;
  }
  await fetch(`${API}/songs/${id}`, { method: 'DELETE' });
}

async function updateSong(id, patch) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const i = songs.findIndex(s => s.id === id);
    if (i !== -1) {
      if (patch.name !== undefined) patch = { ...patch, name: lsUniqueName(patch.name, id) };
      Object.assign(songs[i], patch);
      lsSetSongs(songs);
    }
    return;
  }
  const res = await fetch(`${API}/songs/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });
  return res.json();
}

async function trashSong(id) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const s = songs.find(s => s.id === id);
    if (s) { s.trashed_at = new Date().toISOString(); lsSetSongs(songs); }
    return;
  }
  await fetch(`${API}/songs/${id}/trash`, { method: 'PUT' });
}

async function restoreSong(id) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const s = songs.find(s => s.id === id);
    if (s) { s.trashed_at = null; s.name = lsUniqueName(s.name, id); lsSetSongs(songs); }
    return;
  }
  await fetch(`${API}/songs/${id}/restore`, { method: 'PUT' });
}

async function fetchSettings() {
  if (!IS_SERVED) return lsGetSettings();
  const res = await fetch(`${API}/settings`);
  return res.json();
}

async function saveSetting(key, value) {
  if (!IS_SERVED) {
    const s = lsGetSettings();
    s[key] = value;
    localStorage.setItem('sf_settings', JSON.stringify(s));
    return;
  }
  await fetch(`${API}/settings/${encodeURIComponent(key)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ value }),
  });
}

// ── LIBRARY ───────────────────────────────────────────────────────────────────
//
// The currently-loaded (or in-progress unsaved) song is just a highlighted row
// in this same list, with Save inline — not a separate strip duplicating it.
// Its presence is derived from state (currentSong, or sel.size>0 with no
// currentSong) rather than toggled by a specific button, so it always reflects
// reality. Songs with pinned scales get a chevron to expand nested chips;
// clicking one opens that scale directly. Deleting moves a song to a Trash
// section (no confirmation dialog) instead of destroying it immediately.

let librarySongs = [];      // cached non-trashed songs
let libraryTrash = [];      // cached trashed songs
let expandedSongs = new Set();
let pendingSongName = 'Untitled'; // working title for an unsaved (no currentSong) draft

function openDrawer() {
  document.getElementById('sidebar-panel').classList.remove('collapsed');
  return refreshLibrary();
}

function toggleDrawer() {
  const panel = document.getElementById('sidebar-panel');
  const isOpen = !panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed', isOpen);
  if (!isOpen) refreshLibrary();
}

async function refreshLibrary() {
  librarySongs = await fetchSongs();
  libraryTrash = await fetchTrash();
  renderLibrary();
}

function parseSongFields(song) {
  const notes  = typeof song.notes === 'string' ? JSON.parse(song.notes) : song.notes;
  const scales = song.scales ? (typeof song.scales === 'string' ? JSON.parse(song.scales) : song.scales) : [];
  return { notes, scales };
}

function timeSince(iso) {
  const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (secs < 60) return 'just now';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

// Renders pinned-scale chips for a row. unpinFn is the exact onclick body to
// unpinCall(key) builds the exact onclick body for a chip's ✕ — active rows
// unpin against the live working set, saved-but-inactive rows unpin against
// that song's persisted scales, so the call differs per row type.
function renderNestedScales(keys, unpinCall) {
  if (!keys.length) return '';
  return `<div class="song-item-nested">` + keys.map(key => {
    const sep = key.indexOf(':');
    const root = +key.slice(0, sep);
    const scaleName = key.slice(sep + 1);
    return `
    <div class="song-item-nested-row" onclick="openScaleModal(${root},'${scaleName}')">
      <span class="nested-swatch"></span>
      <span class="nested-name">${noteName(root)} ${scaleName}</span>
      <span class="nested-type">scale</span>
      <span class="nested-unpin" onclick="event.stopPropagation();${unpinCall(key)}" title="Unpin">✕</span>
    </div>`;
  }).join('') + `</div>`;
}

// The active row's baseline is "what's actually saved" — anything live sel/
// pickedScales differs from that is unsaved, which is the only time Save
// needs to show at all.
let savedSnapshot = null;
function snapshotKey() {
  return JSON.stringify({ notes: [...sel].sort((a, b) => a - b), scales: [...pickedScales].sort() });
}
function isDirty() {
  return currentSong ? savedSnapshot !== snapshotKey() : sel.size > 0;
}

function renderLibrary() {
  const list = document.getElementById('drawer-list');
  if (!list) return;
  if (list.querySelector('.song-item-name-edit')) return; // don't clobber an in-progress rename

  if (librarySongs.length === 0 && libraryTrash.length === 0 && sel.size === 0) {
    list.innerHTML = '<div class="sidebar-empty">No saved songs yet.<br>Save a note set to see it here.</div>';
    return;
  }

  let html = '';
  const saveBtn = isDirty() ? `<button class="song-item-save" onclick="event.stopPropagation();saveActiveRow()">Save</button>` : '';

  // In-progress draft with no saved song behind it yet — always sits on top.
  if (!currentSong && sel.size > 0) {
    const pinned = [...pickedScales];
    const expanded = expandedSongs.has('draft');
    html += `
    <div class="song-item active-row">
      ${pinned.length ? `<span class="song-item-chevron${expanded ? ' expanded' : ''}" onclick="event.stopPropagation();toggleSongExpand('draft')">▸</span>` : ''}
      <div class="song-item-body">
        <div class="song-item-name" onclick="event.stopPropagation();startRenameActiveRow(this, null)">${pendingSongName}</div>
      </div>
      ${saveBtn}
    </div>`;
    if (pinned.length && expanded) html += renderNestedScales(pinned, key => `unpinFromActiveRow('${key}')`);
  }

  for (const song of librarySongs) {
    const { scales } = parseSongFields(song);
    const date = new Date(song.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    if (currentSong && currentSong.id === song.id) {
      const pinned = [...pickedScales];
      const scaleLabel = pinned.length ? ` · ${pinned.length} scale${pinned.length > 1 ? 's' : ''}` : '';
      const expanded = expandedSongs.has(song.id);
      html += `
      <div class="song-item active-row" data-song-id="${song.id}">
        ${pinned.length ? `<span class="song-item-chevron${expanded ? ' expanded' : ''}" onclick="event.stopPropagation();toggleSongExpand(${song.id})">▸</span>` : ''}
        <div class="song-item-body">
          <div class="song-item-name" onclick="event.stopPropagation();startRenameActiveRow(this, ${song.id})">${song.name}</div>
          <div class="song-item-meta">${date}${scaleLabel}</div>
        </div>
        ${saveBtn}
      </div>`;
      if (pinned.length && expanded) html += renderNestedScales(pinned, key => `unpinFromActiveRow('${key}')`);
      continue;
    }

    const scaleLabel = scales.length ? ` · ${scales.length} scale${scales.length > 1 ? 's' : ''}` : '';
    const hasChildren = scales.length > 0;
    const expanded = expandedSongs.has(song.id);
    html += `
    <div class="song-item" data-song-id="${song.id}">
      ${hasChildren ? `<span class="song-item-chevron${expanded ? ' expanded' : ''}" onclick="event.stopPropagation();toggleSongExpand(${song.id})">▸</span>` : ''}
      <div class="song-item-body" onclick="loadSong(${song.id})">
        <div class="song-item-name">${song.name}</div>
        <div class="song-item-meta">${date}${scaleLabel}</div>
      </div>
      <button class="song-item-trash-btn" onclick="event.stopPropagation();moveToTrash(${song.id})" title="Move to Trash">🗑</button>
    </div>`;

    if (hasChildren && expanded) {
      html += renderNestedScales(scales, key => `unpinFromSong(${song.id},'${key}')`);
    }
  }

  if (libraryTrash.length > 0) {
    html += `<div class="library-trash-title">Trash</div>`;
    for (const song of libraryTrash) {
      html += `
      <div class="song-item trashed" data-song-id="${song.id}">
        <div class="song-item-body">
          <div class="song-item-name">${song.name}</div>
          <div class="song-item-meta">Deleted ${timeSince(song.trashed_at)}</div>
        </div>
        <button class="song-item-restore" onclick="event.stopPropagation();restoreFromTrashUI(${song.id})">Restore</button>
      </div>`;
    }
  }

  list.innerHTML = html || '<div class="sidebar-empty">No saved songs yet.<br>Save a note set to see it here.</div>';
}

function toggleSongExpand(id) {
  expandedSongs.has(id) ? expandedSongs.delete(id) : expandedSongs.add(id);
  renderLibrary();
}

// Unpins against the live working set (used by the active row, whether that's
// a loaded song or an unsaved draft) — persists immediately if there's a
// currentSong to persist to.
async function unpinFromActiveRow(key) {
  pickedScales.delete(key);
  analyze();
  if (currentSong) {
    await updateSong(currentSong.id, { scales: [...pickedScales] });
    const cached = librarySongs.find(s => s.id === currentSong.id);
    if (cached) cached.scales = [...pickedScales];
    savedSnapshot = snapshotKey();
  }
  renderLibrary();
}

function loadSong(id) {
  const song = librarySongs.find(s => s.id === id);
  if (!song) return;
  const { notes, scales } = parseSongFields(song);
  currentSong = { id: song.id, name: song.name };
  pendingSongName = 'Untitled';
  sel.clear();
  notes.forEach(n => sel.add(n));
  pickedScales.clear();
  scales.forEach(k => pickedScales.add(k));
  savedSnapshot = snapshotKey();
  refreshButtons();
  analyze();
  renderLibrary();
  history.replaceState(null, '', `${location.pathname}${location.search}#song=${song.id}`);
}

// Reads #song=<id> on load and restores that song; strips the hash (without
// adding a history entry, like a permanent redirect) if it's malformed or the
// song no longer exists.
function restoreSongFromHash() {
  const m = location.hash.match(/^#song=(\d+)$/);
  const found = m ? librarySongs.some(s => s.id === +m[1]) : false;
  if (!found) {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    return;
  }
  loadSong(+m[1]);
}

async function moveToTrash(id) {
  await trashSong(id);
  if (currentSong && currentSong.id === id) {
    currentSong = null;
    history.replaceState(null, '', location.pathname + location.search);
  }
  await refreshLibrary();
}

async function restoreFromTrashUI(id) {
  await restoreSong(id);
  await refreshLibrary();
}

async function unpinFromSong(songId, key) {
  const song = librarySongs.find(s => s.id === songId);
  if (!song) return;
  const { scales } = parseSongFields(song);
  const updated = scales.filter(k => k !== key);
  await updateSong(songId, { scales: updated });
  if (currentSong && currentSong.id === songId) {
    pickedScales.delete(key);
    analyze();
  }
  await refreshLibrary();
}

// Click-to-rename: swaps the row's name for an input, focused immediately.
// songId null means "this is the unsaved draft" — commits to pendingSongName
// locally instead of hitting the API (nothing exists to rename yet).
function startRenameActiveRow(nameEl, songId) {
  const current = nameEl.textContent;
  const input = document.createElement('input');
  input.className = 'song-item-name-edit';
  input.value = current === 'Untitled' ? '' : current;
  input.placeholder = 'Untitled';
  nameEl.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if (committed) return;
    committed = true;
    const val = input.value.trim() || 'Untitled';
    input.remove(); // renderLibrary() refuses to run while this input is still in the DOM
    if (songId) {
      const updated = await updateSong(songId, { name: val });
      if (currentSong && currentSong.id === songId) currentSong.name = updated.name;
      await refreshLibrary();
    } else {
      pendingSongName = val;
      renderLibrary();
    }
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') commit().then(saveActiveRow);
  });
}

async function saveActiveRow() {
  if (sel.size === 0) return;
  if (currentSong) {
    const updated = await updateSong(currentSong.id, { notes: [...sel], scales: [...pickedScales] });
    currentSong.name = updated.name;
  } else {
    const saved = await saveSong(pendingSongName, [...sel], [...pickedScales]);
    currentSong = { id: saved.id, name: saved.name };
    history.replaceState(null, '', `${location.pathname}${location.search}#song=${saved.id}`);
  }
  savedSnapshot = snapshotKey();
  await refreshLibrary();
}

// + menu (New / Import)
function togglePlusMenu() {
  const menu = document.getElementById('plus-menu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', e => {
  if (!e.target.closest('#btn-plus, #plus-menu')) document.getElementById('plus-menu').style.display = 'none';
});
document.getElementById('menu-new-item').addEventListener('click', () => {
  document.getElementById('plus-menu').style.display = 'none';
  clearCurrentSong();
});

refreshLibrary().then(restoreSongFromHash);

// ── INIT ─────────────────────────────────────────────────────────────────────

buildNoteGrid();
syncInstrumentButtons(); // reflect the default immediately; settings may override below

fetchSettings().then(s => {
  if (s.instrument === 'guitar' || s.instrument === 'bass') {
    instrument = s.instrument;
  }
  syncInstrumentButtons();
  if (s.resultsView === 'chords') {
    resultsView = 'chords';
    document.querySelectorAll('.results-view-btn').forEach(b => b.classList.toggle('on', b.dataset.view === 'chords'));
  }
  if (s.scaleView === 'position') {
    modalView = 'position';
  }
  if (s.useFlats === '1') {
    useFlats = true;
    document.getElementById('acc-sharp').classList.remove('on');
    document.getElementById('acc-flat').classList.add('on');
    document.querySelectorAll('#note-grid .note-btn').forEach(b => {
      b.innerHTML = `<span class="nn">${noteName(+b.dataset.i)}</span>`;
    });
    analyze();
  } else {
    document.getElementById('acc-sharp').classList.add('on');
  }
  if (s.theme === 'light') setTheme('light');
  else setTheme('dark');
}).catch(() => {});
</script>

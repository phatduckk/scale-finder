  if (fretDragInitDone) return; // #fboard and document persist across re-renders — attach once
  fretDragInitDone = true;
  const fboard = document.getElementById('fboard');

  fboard.addEventListener('mousedown', e => {
    const numEl = e.target.closest('.fret-num[data-fret]');
    if (!numEl) return;
    e.preventDefault();
    dragInfo = { anchor: +numEl.dataset.fret, moved: false };
  });

  document.addEventListener('mousemove', e => {
    if (!dragInfo) return;
    const numEl = e.target.closest?.('.fret-num[data-fret]');
    if (!numEl) return;
    const f = +numEl.dataset.fret;
    if (f === dragInfo.anchor && !dragInfo.moved) return;
    dragInfo.moved = true;
    const lo = Math.min(dragInfo.anchor, f);
    const hi = Math.max(dragInfo.anchor, f);
    litFrets = new Set(Array.from({ length: hi - lo + 1 }, (_, i) => lo + i));
    applyFretHighlight();
  });

  document.addEventListener('mouseup', () => {
    if (!dragInfo) return;
    if (!dragInfo.moved) {
      // plain click — toggle this fret
      const f = dragInfo.anchor;
      litFrets.has(f) ? litFrets.delete(f) : litFrets.add(f);
      applyFretHighlight();
    }
    dragInfo = null;
  });

  // Click a scale note to anchor a directional run there: 1st click ascends
  // from that note, 2nd click (same note) descends, 3rd click clears it.
  fboard.addEventListener('click', e => {
    const dot = e.target.closest('.ndot');
    if (!dot) return;
    const fret = +dot.closest('[data-fret]').dataset.fret;
    const row = dot.closest('.str-row');
    const stringIdx = [...fboard.querySelectorAll('.str-row')].indexOf(row);

    if (anchorNote && anchorNote.stringIdx === stringIdx && anchorNote.fret === fret) {
      anchorNote = anchorNote.direction > 0 ? { stringIdx, fret, direction: -1 } : null;
    } else {
      anchorNote = { stringIdx, fret, direction: 1 };
    }

    const scale = getModalScaleData();
    if (scale) renderFretboard(modalRoot, scale);
  });
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function toggleModalPin() {
  togglePick(modalRoot, modalScaleName);
  syncModalPin();
}

function syncModalPin() {
  const key = `${modalRoot}:${modalScaleName}`;
  const on  = pickedScales.has(key);
  const btn = document.getElementById('modal-pin-btn');
  btn.classList.toggle('on', on);
  document.getElementById('modal-pin-label').textContent = on ? 'Pinned' : 'Pin';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Instrument now only controls the scale modal's fretboard (which strings to
// show) — it no longer gates anything on the results page, since that's what
// the Scales/Chords tabs are for.
function setInstrument(inst) {
  if (inst !== 'guitar' && inst !== 'bass') return;
  instrument = inst;
  syncInstrumentButtons();
  saveSetting('instrument', instrument).catch(() => {});
  anchorNote = null; // string indices don't carry over between instruments
  const scale = getModalScaleData();
  if (scale && document.getElementById('modal-overlay').classList.contains('open')) {
    renderFretboard(modalRoot, scale);
  }
}

function syncInstrumentButtons() {
  document.querySelectorAll('.modal-inst-btn').forEach(b => b.classList.toggle('on', b.dataset.minst === instrument));
}

document.querySelectorAll('.modal-inst-btn').forEach(b => {
  b.addEventListener('click', () => setInstrument(b.dataset.minst));
});

// Scales/Chords tab — which section of the results renders.
function setResultsView(view) {
  if (view !== 'scales' && view !== 'chords') return;
  resultsView = view;
  document.querySelectorAll('.results-view-btn').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  saveSetting('resultsView', resultsView).catch(() => {});
  analyze();
}

// Modal view toggle (all notes vs. single lesson-book position)
document.querySelectorAll('.modal-view-btn').forEach(b => {
  b.addEventListener('click', () => {
    modalView = b.dataset.mview;
    document.querySelectorAll('.modal-view-btn').forEach(x => x.classList.toggle('on', x === b));
    saveSetting('scaleView', modalView).catch(() => {});
    anchorNote = null; // an explicit view choice overrides any active anchored run
    const scale = getModalScaleData();
    if (scale) renderFretboard(modalRoot, scale);
  });
});

// ── FILE IMPORT ───────────────────────────────────────────────────────────────

const NOTE_TO_IDX = {
  'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,
  'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11
};

// Guitar string open notes (low E to high e)
const TAB_STRINGS = {
  'E':4, 'A':9, 'D':2, 'G':7, 'B':11, 'e':4
};

// Curated display order for the "<Note>'s Chords" reference section — most
// commonly used qualities first.
const CHORD_DISPLAY_ORDER = ['maj','m','5','7','maj7','m7','dim','aug','sus2','sus4','add9','m9','dim7','m7b5','mM7','madd9','9'];

function chordIntervalRole(iv) {
  const semis = iv % 12;
  if (semis === 0) return 'root';
  if (semis === 3 || semis === 4) return 'third';
  if (semis === 6 || semis === 7 || semis === 8) return 'fifth';
  return 'scale'; // 2nd/7th/9th — no dedicated accent color, shown neutral
}

function buildChordCard(root, quality) {
  const ivs = CHORD_INTERVALS[quality];
  if (!ivs) return '';
  const rootName = noteName(root);
  const suffix = quality === 'maj' ? '' : quality;
  let pills = '';
  for (const iv of ivs) {
    const ni = (root + iv) % 12;
    const role = chordIntervalRole(iv);
    const cls = role === 'scale' ? 'snote scale' : `snote triad-${role}`;
    pills += `<div class="${cls}">${noteName(ni)}</div>`;
  }
  return `
  <div class="scale-card" onclick="openChordModal(${root}, '${quality}')">
    <div class="scale-card-hdr">
      <span class="scale-root">${rootName}${suffix}</span>
      <span class="scale-count">${ivs.length} notes</span>
    </div>
    <div class="note-row">${pills}</div>
  </div>`;
}

const CHORD_INTERVALS = {
  'maj':   [0,4,7],
  'm':     [0,3,7],
  '5':     [0,7],
  'dim':   [0,3,6],
  'aug':   [0,4,8],
  '7':     [0,4,7,10],
  'maj7':  [0,4,7,11],
  'm7':    [0,3,7,10],
  'mM7':   [0,3,7,11],
  'm7b5':  [0,3,6,10],
  'dim7':  [0,3,6,9],
  'sus2':  [0,2,7],
  'sus4':  [0,5,7],
  'add9':  [0,2,4,7],
  'madd9': [0,2,3,7],
  '9':     [0,4,7,10,14],
  'm9':    [0,3,7,10,14],
};

const CHORD_LABELS = {
  'maj': 'Major', 'm': 'Minor', '5': 'Power Chord', 'dim': 'Diminished', 'aug': 'Augmented',
  '7': 'Dominant 7th', 'maj7': 'Major 7th', 'm7': 'Minor 7th', 'mM7': 'Minor-Major 7th',
  'm7b5': 'Half-Diminished (m7♭5)', 'dim7': 'Diminished 7th', 'sus2': 'Sus2', 'sus4': 'Sus4',
  'add9': 'Add9', 'madd9': 'Minor Add9', '9': 'Dominant 9th', 'm9': 'Minor 9th',
};

// The triad each quality is built on — what the modal's "Triad" view falls
// back to. A quality mapped to itself (maj, m, dim, aug, sus2, sus4, the
// power chord) has nothing to drop, so it gets no Whole Chord/Triad toggle
// at all (see chordHasTriadReduction).
const CHORD_TRIAD_OF = {
  'maj': 'maj', 'm': 'm', '5': '5', 'dim': 'dim', 'aug': 'aug', 'sus2': 'sus2', 'sus4': 'sus4',
  '7': 'maj', 'maj7': 'maj', 'add9': 'maj', '9': 'maj',
  'm7': 'm', 'mM7': 'm', 'madd9': 'm', 'm9': 'm',
  'm7b5': 'dim', 'dim7': 'dim',
};

// Chord matching for multi-note selections: same subset rule the Scales tab
// already uses (your notes ⊆ candidate — the candidate may have more), so a
// partial voicing like G+B (root+third, no fifth) still surfaces G Major
// instead of matching nothing. Ranked by coverage first (the tightest fit —
// fewest notes you didn't pick — sorts first; an exact match naturally lands
// at the top since its coverage is 1), then by CHORD_DISPLAY_ORDER's
// commonness rank so ties (e.g. every 3-note chord containing G+B) put
// G Major ahead of D#aug instead of falling back to root order. Symmetric
// chords (dim7, aug) legitimately match several roots at once, same as
// scales do for modal/relative matches.
function matchedChords(input) {
  const results = [];
  CHORD_DISPLAY_ORDER.forEach((q, rank) => {
    for (let root = 0; root < 12; root++) {
      const chordNotes = [...new Set(CHORD_INTERVALS[q].map(iv => (root + iv) % 12))];
      if (!input.every(n => chordNotes.includes(n))) continue;
      results.push({ root, quality: q, rank, coverage: input.length / chordNotes.length });
    }
  });
  results.sort((a, b) => b.coverage - a.coverage || a.rank - b.rank || a.root - b.root);
  return results;
}

// ── REAL CHORD VOICINGS ──────────────────────────────────────────────────────
//
// Fret-per-string shapes (low E to high e; 'x' = muted, 0 = open), for the
// qualities where a single well-known guitar shape exists. Every shape below
// was checked against CHORD_INTERVALS by computing each string's actual
// sounding pitch class — not eyeballed from a chart — so they're guaranteed
// to contain exactly the right notes.
//
// E_SHAPE / A_SHAPE are the classic movable "barre" templates (root on the
// low E string / A string respectively, at fret 0 = open position). For any
// other root the same finger pattern just slides up by however many frets
// that root sits above E (or above A) — whichever is the lower position.
const E_SHAPE = {
  maj:   [0,2,2,1,0,0],
  m:     [0,2,2,0,0,0],
  '7':   [0,2,0,1,0,0],
  maj7:  [0,2,1,1,0,0],
  m7:    [0,2,0,0,0,0],
  sus4:  [0,2,2,2,0,0],
  sus2:  [0,2,4,4,0,0],
  '5':   [0,2,2,'x','x','x'],
  dim:   [0,1,2,0,'x',0],
  aug:   [0,3,2,1,1,0],
  dim7:  [0,1,2,0,2,0],
  m7b5:  [0,1,0,0,3,0],
  mM7:   [0,2,1,0,0,0],
  add9:  [0,2,4,1,0,0],
  madd9: [0,2,4,0,0,0],
  '6':   [0,2,2,1,2,0],
  m6:    [0,2,2,0,2,0],
  '9':   [0,2,0,1,3,2],
  m9:    [0,2,0,0,3,2],
};
const A_SHAPE = {
  maj:   ['x',0,2,2,2,0],
  m:     ['x',0,2,2,1,0],
  '7':   ['x',0,2,0,2,0],
  maj7:  ['x',0,2,1,2,0],
  m7:    ['x',0,2,0,1,0],
  sus4:  ['x',0,2,2,3,0],
  sus2:  ['x',0,2,2,0,0],
  '5':   ['x',0,2,'x','x','x'],
  dim:   ['x',0,1,2,1,'x'],
  aug:   ['x',0,3,2,2,1],
  dim7:  ['x',0,1,2,1,2],
  m7b5:  ['x',0,1,0,1,3],
  mM7:   ['x',0,2,1,1,0],
  add9:  ['x',0,2,4,2,0],
  madd9: ['x',0,2,4,1,0],
  '6':   ['x',0,2,2,2,2],
  m6:    ['x',0,2,2,1,2],
  '9':   ['x',4,2,0,0,5],
  m9:    ['x',3,2,0,0,5],
};
// A few classic open-position shapes that are more idiomatic than the movable
// templates above for these specific roots — every guitarist's first chords.
const OPEN_CHORD_SHAPES = {
  4:  { maj:[0,2,2,1,0,0], m:[0,2,2,0,0,0], '7':[0,2,0,1,0,0], maj7:[0,2,1,1,0,0], m7:[0,2,0,0,0,0], sus4:[0,2,2,2,0,0] }, // E
  9:  { maj:['x',0,2,2,2,0], m:['x',0,2,2,1,0], '7':['x',0,2,0,2,0], maj7:['x',0,2,1,2,0], m7:['x',0,2,0,1,0], sus4:['x',0,2,2,3,0], sus2:['x',0,2,2,0,0] }, // A
  2:  { maj:['x','x',0,2,3,2], m:['x','x',0,2,3,1], '7':['x','x',0,2,1,2], maj7:['x','x',0,2,2,2], m7:['x','x',0,2,1,1], sus4:['x','x',0,2,3,3] }, // D
  7:  { maj:[3,2,0,0,0,3], '7':[3,2,0,0,0,1], maj7:[3,2,0,0,0,2] }, // G
  0:  { maj:['x',3,2,0,1,0], '7':['x',3,2,3,1,0], maj7:['x',3,2,0,0,0] }, // C
  11: { '7':['x',2,1,2,0,2] }, // B
};

// Returns { frets, startFret } for a root+quality we have a verified shape
// for, or null if this quality isn't one of them (caller should fall back to
// the derived fretboard-position view instead of guessing).
function getChordVoicing(root, quality) {
  const openShape = OPEN_CHORD_SHAPES[root] && OPEN_CHORD_SHAPES[root][quality];
  if (openShape) return { frets: openShape, startFret: 0 };

  if (!E_SHAPE[quality]) return null;
  const rootFretE = (root - 4 + 12) % 12;
  const rootFretA = (root - 9 + 12) % 12;
  const useE = rootFretE <= rootFretA;
  const rootFret = useE ? rootFretE : rootFretA;
  const template = useE ? E_SHAPE[quality] : A_SHAPE[quality];
  const frets = template.map(v => v === 'x' ? 'x' : v + rootFret);
  return { frets, startFret: rootFret };
}

const OPEN_STRING_NOTES = [4, 9, 2, 7, 11, 4]; // low E, A, D, G, B, high e — shared with renderChordDiagram

// Minimal "close voicing" triads for the modal's Triad toggle — the standard
// movable 3-string-family system real guitarists actually learn (verified
// against "Guitar Chord Inversions", appliedguitartheory.com: for any major
// or minor triad, root/1st-inversion/2nd-inversion each have a fixed shape
// on strings 6-5-4, 5-4-3, or 4-3-2 — same 3 adjacent strings for all three
// inversions of a given family, just sliding up the neck). That's the piece
// a naive "search every possible string combo, keep whichever is smallest"
// solver misses: it optimizes each inversion independently, so root
// position might land on strings 6-4-2 while 1st inversion lands on 5-3-2 —
// two unrelated, unrecognizable shapes, even though each is individually
// "optimal." A fixed family per chord, reused across all three inversions,
// is what actually makes this learnable — you recognize "the 6th-string
// shape" the next time you see it, moved to a different fret.
//
// bassIndex picks which of the chord's unique intervals (in CHORD_INTERVALS'
// own order — index 0 is always the root) is forced onto the lowest (bass)
// string of the family: 0 for root position, 1 for first inversion, 2 for
// second.
const TRIAD_STRING_FAMILIES = [[0,1,2],[1,2,3],[2,3,4]]; // 6th/5th/4th-string-root, per the PDF
const POWER_STRING_FAMILIES = [[0,1],[1,2],[2,3]]; // same idea, one fewer note
const PERMS_3 = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
const PERMS_2 = [[0,1],[1,0]];

// Computes the voicing for one specific family (fixed set of adjacent
// strings) and bass note — the family itself is never re-chosen here, so
// calling this across bassIndex 0/1/2 with the same `strings` array is what
// keeps root/1st/2nd inversion as one consistent, recognizable shape.
// shiftFrets (always 0 or a positive multiple of 12) moves the whole shape
// up by that many frets — the shape repeats every octave, so this is how
// "show it up around fret 7" is done: not a different shape, just a later
// occurrence of the same one. The shift is computed once from root position
// in renderTriadInversions and reused for every bassIndex here, so all
// three inversions move together instead of each independently chasing the
// target fret and ending up scattered.
function triadVoicingForFamily(root, quality, bassIndex, strings, shiftFrets = 0) {
  const ivs = [...new Set(CHORD_INTERVALS[quality].map(iv => iv % 12))];
  const isPower = ivs.length === 2;
  if (bassIndex >= ivs.length) return null;
  const targets = ivs.map(iv => (root + iv) % 12);
  const perms = (isPower ? PERMS_2 : PERMS_3).filter(order => order[0] === bassIndex);

  // Two fingerings put the bass note on this family's lowest string (the
  // other two notes can swap order on the remaining strings) — keep
  // whichever sits closer to the nut, same tiebreak as everywhere else here.
  //
  // Each note's raw fret (0-11, the string's own lowest occurrence of that
  // pitch) is only one octave of it — the other is raw+12, same pitch class,
  // one octave up. A shape can look artificially wide (span 11: frets
  // 0, 0, 11) when it's actually a tight cluster that wrapped around the
  // fret-0/12 boundary (12, 12, 11 — span 1). Trying both octaves per note
  // and keeping whichever combination is tightest is what the PDF's own
  // 2nd-inversion diagrams do (A major: 5th and root pushed to fret 12
  // alongside the 3rd's natural fret 11, not left at their own fret 0).
  let best = null;
  for (const order of perms) {
    const raw = order.map((targetIdx, i) => (targets[targetIdx] - OPEN_STRING_NOTES[strings[i]] + 12) % 12);
    for (let mask = 0; mask < (1 << raw.length); mask++) {
      const frets = raw.map((f, i) => (mask & (1 << i)) ? f + 12 : f);
      const span = Math.max(...frets) - Math.min(...frets);
      const highFret = Math.max(...frets);
      // Span first, not highest-fret-used first: a 1-fret reach up at fret 12
      // is an easier hand position than a 7-fret stretch starting at fret 0,
      // even though the latter technically starts "lower." Without this, the
      // octave-collapsing above finds the tight fret-12 cluster but then
      // loses to a wider, lower-starting spread anyway.
      if (!best || span < best.span || (span === best.span && highFret < best.highFret)) {
        best = { frets, span, highFret, startFret: Math.min(...frets) };
      }
    }
  }
  if (!best) return null;

  if (shiftFrets > 0) {
    best = {
      frets: best.frets.map(f => f + shiftFrets),
      span: best.span,
      highFret: best.highFret + shiftFrets,
      startFret: best.startFret + shiftFrets,
    };
  }

  const fullFrets = new Array(6).fill('x');
  strings.forEach((s, i) => { fullFrets[s] = best.frets[i]; });
  return { frets: fullFrets, startFret: best.startFret, highFret: best.highFret, span: best.span };
}

// Root position + every inversion, side by side — the point of showing
// inversions at all is comparing how the same notes rearrange across
// strings, which gets lost if you can only look at one at a time. Whichever
// family (6th/5th/4th-string-root) gives the most compact root position is
// the one used for all three — see triadVoicingForFamily. With a targetFret,
// that changes to whichever (family, shift) keeps ALL THREE inversions
// closest to the target on average, not just root — a family whose root
// happens to land near the target but whose 1st inversion naturally sits
// far away elsewhere on the neck isn't actually useful to someone playing
// up around that fret, even though root alone looks like a good match.
function renderTriadInversions(root, quality, targetFret = 0) {
  const ivs = [...new Set(CHORD_INTERVALS[quality].map(iv => iv % 12))];
  const positions = ivs.length; // 3 for a real triad, 2 for the power chord
  const families = positions === 2 ? POWER_STRING_FAMILIES : TRIAD_STRING_FAMILIES;

  let family = families[0], shiftFrets = 0, bestScore = Infinity;
  for (const strings of families) {
    const naturals = [];
    for (let bi = 0; bi < positions; bi++) {
      const v = triadVoicingForFamily(root, quality, bi, strings, 0);
      if (!v) break;
      naturals.push(v);
    }
    if (naturals.length !== positions) continue;

    if (targetFret > 0) {
      // Natural positions are already as low as they go (0-11ish), so the
      // target (capped at 24) is at most two octaves above any of them.
      for (let shift = 0; shift <= 24; shift += 12) {
        const score = naturals.reduce((sum, v) => sum + Math.abs(v.startFret + shift - targetFret), 0);
        if (score < bestScore) { bestScore = score; family = strings; shiftFrets = shift; }
      }
    } else {
      const rootVoicing = naturals[0];
      const score = rootVoicing.span * 1000 + rootVoicing.highFret; // span dominates, highFret only breaks ties
      if (score < bestScore) { bestScore = score; family = strings; shiftFrets = 0; }
    }
  }

  let html = `<div class="triad-inversions">`;
  for (let bassIndex = 0; bassIndex < positions; bassIndex++) {
    const voicing = triadVoicingForFamily(root, quality, bassIndex, family, shiftFrets);
    if (!voicing) continue;
    const bassName = noteName((root + ivs[bassIndex]) % 12);
    html += `<div class="triad-inversion">
      <div class="triad-inversion-label">${bassName} bass</div>
      ${renderChordDiagram(root, quality, voicing, true)}
    </div>`;
  }
  html += `</div>`;
  return html;
}

function chordToNotes(token) {
  // Strict: uppercase root only, must consume full token (no trailing junk like "Chords")
  const m = token.match(/^([A-G][#b]?)(m7b5|mM7|maj7|m7|dim7|dim|aug|sus2|sus4|madd9|add9|m9|m|5|7|9)?$/);
  if (!m) return null;
  const root = NOTE_TO_IDX[m[1]];
  if (root === undefined) return null;
  const quality = m[2] || 'maj';
  const ivs = CHORD_INTERVALS[quality] || CHORD_INTERVALS['maj'];
  return { notes: ivs.map(iv => (root + iv) % 12), root, quality };
}

function parseChords(text) {
  const found = new Set();
  const rootFreq = new Map();
  const rootQualFreq = new Map(); // rootIdx → Map(quality → count)
  let firstRoot = null;
  for (const token of text.split(/[\s,|()\[\]\/\-\\]+/)) {
    const result = chordToNotes(token);
    if (!result) continue;
    const { notes, root, quality } = result;
    notes.forEach(n => found.add(n));
    if (firstRoot === null) firstRoot = root;
    rootFreq.set(root, (rootFreq.get(root) || 0) + 1);
    if (!rootQualFreq.has(root)) rootQualFreq.set(root, new Map());
    const qm = rootQualFreq.get(root);
    qm.set(quality, (qm.get(quality) || 0) + 1);
  }
  // Pick the dominant non-maj quality per root
  const rootQuality = new Map();
  for (const [root, qm] of rootQualFreq) {
    let bestQ = null, bestCount = 0;
    for (const [q, count] of qm) {
      if (q !== 'maj' && count > bestCount) { bestQ = q; bestCount = count; }
    }
    if (bestQ) rootQuality.set(root, bestQ);
  }
  // Explicit key signature wins over first-chord heuristic
  const keyMatch = text.match(/\bkey[:\s]+([A-G][#b]?)\s*(minor|major|min|maj)?\b/i);
  if (keyMatch) {
    const keyRoot = NOTE_TO_IDX[keyMatch[1]];
    if (keyRoot !== undefined) firstRoot = keyRoot;
  }
  return { notes: found, rootFreq, firstRoot, rootQuality };
}

function parseTabs(text) {
  const found = new Set();
  // Match lines like:  e|--0--3--5--|  or  E |--0--3--|
  const tabLine = /^([EADGBe])\s*\|([^\n]+)/gm;
  let m;
  while ((m = tabLine.exec(text)) !== null) {
    const stringLabel = m[1];
    const open = TAB_STRINGS[stringLabel];
    if (open === undefined) continue;
    // Extract all fret numbers from this line
    for (const fret of m[2].matchAll(/\d+/g)) {
      found.add((open + parseInt(fret[0])) % 12);
    }
  }
  return found;
}

function applyImportedNotes({ notes, rootFreq, firstRoot = null, rootQuality = new Map() }) {
  if (notes.size === 0) { alert('No recognizable notes or chords found in this file.'); return; }
  chordRootFreq = rootFreq;
  firstChordRoot = firstRoot;
  appliedChords.clear();
  for (const [root, quality] of rootQuality) {
    if (POPOVER_CHORDS.includes(quality)) appliedChords.set(root, quality);
  }
  sel.clear();
  notes.forEach(n => sel.add(n));
  refreshButtons();
  analyze();
}


async function extractPdfText(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data = await file.arrayBuffer();
  const pdf  = await pdfjsLib.getDocument({ data }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page    = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

document.getElementById('file-import').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  let text;
  if (file.name.endsWith('.pdf')) {
    text = await extractPdfText(file);
  } else {
    text = await file.text();
  }

  // Try tab notation first (more specific); fall back to chord names
  const tabNotes = parseTabs(text);
  if (tabNotes.size > 0) {
    applyImportedNotes({ notes: tabNotes, rootFreq: new Map() });
  } else {
    applyImportedNotes(parseChords(text));
  }
});

// ── STORAGE ───────────────────────────────────────────────────────────────────

const IS_SERVED = window.location.protocol !== 'file:';
const API = 'http://localhost:3001/api';

// localStorage helpers
function lsGetSongs() {
  return JSON.parse(localStorage.getItem('sf_songs') || '[]');
}
function lsSetSongs(songs) {
  localStorage.setItem('sf_songs', JSON.stringify(songs));
}
function lsGetSettings() {
  return JSON.parse(localStorage.getItem('sf_settings') || '{}');
}
// Mirrors the server's uniqueName() — appends " 2", " 3", etc. until the name
// isn't taken by any song (trashed or not, matching the DB's UNIQUE constraint).
function lsUniqueName(base, excludeId) {
  const all = lsGetSongs();
  let name = base, n = 2;
  while (all.some(s => s.name === name && s.id !== excludeId)) { name = `${base} ${n}`; n++; }
  return name;
}

async function fetchSongs() {
  if (!IS_SERVED) return lsGetSongs().filter(s => !s.trashed_at);
  const res = await fetch(`${API}/songs`);
  return res.json();
}

async function fetchTrash() {
  if (!IS_SERVED) return lsGetSongs().filter(s => s.trashed_at);
  const res = await fetch(`${API}/songs/trash`);
  return res.json();
}

async function saveSong(name, notes, scales) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const song = { id: Date.now(), name: lsUniqueName(name), notes, scales, created_at: new Date().toISOString(), trashed_at: null };
    lsSetSongs([song, ...songs]);
    return song;
  }
  const res = await fetch(`${API}/songs`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, notes, scales }),
  });
  if (!res.ok) throw new Error('save failed');
  return res.json();
}

async function deleteSong(id) {
  if (!IS_SERVED) {
    lsSetSongs(lsGetSongs().filter(s => s.id !== id));
    return;
  }
  await fetch(`${API}/songs/${id}`, { method: 'DELETE' });
}

async function updateSong(id, patch) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const i = songs.findIndex(s => s.id === id);
    if (i !== -1) {
      if (patch.name !== undefined) patch = { ...patch, name: lsUniqueName(patch.name, id) };
      Object.assign(songs[i], patch);
      lsSetSongs(songs);
    }
    return;
  }
  const res = await fetch(`${API}/songs/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });
  return res.json();
}

async function trashSong(id) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const s = songs.find(s => s.id === id);
    if (s) { s.trashed_at = new Date().toISOString(); lsSetSongs(songs); }
    return;
  }
  await fetch(`${API}/songs/${id}/trash`, { method: 'PUT' });
}

async function restoreSong(id) {
  if (!IS_SERVED) {
    const songs = lsGetSongs();
    const s = songs.find(s => s.id === id);
    if (s) { s.trashed_at = null; s.name = lsUniqueName(s.name, id); lsSetSongs(songs); }
    return;
  }
  await fetch(`${API}/songs/${id}/restore`, { method: 'PUT' });
}

async function fetchSettings() {
  if (!IS_SERVED) return lsGetSettings();
  const res = await fetch(`${API}/settings`);
  return res.json();
}

async function saveSetting(key, value) {
  if (!IS_SERVED) {
    const s = lsGetSettings();
    s[key] = value;
    localStorage.setItem('sf_settings', JSON.stringify(s));
    return;
  }
  await fetch(`${API}/settings/${encodeURIComponent(key)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ value }),
  });
}

// ── LIBRARY ───────────────────────────────────────────────────────────────────
//
// The currently-loaded (or in-progress unsaved) song is just a highlighted row
// in this same list, with Save inline — not a separate strip duplicating it.
// Its presence is derived from state (currentSong, or sel.size>0 with no
// currentSong) rather than toggled by a specific button, so it always reflects
// reality. Songs with pinned scales get a chevron to expand nested chips;
// clicking one opens that scale directly. Deleting moves a song to a Trash
// section (no confirmation dialog) instead of destroying it immediately.

let librarySongs = [];      // cached non-trashed songs
let libraryTrash = [];      // cached trashed songs
let expandedSongs = new Set();
let pendingSongName = 'Untitled'; // working title for an unsaved (no currentSong) draft
let draftNameTyped = false; // true once the user has actually typed a draft name — Save refuses to persist the untouched "Untitled" placeholder
let draftStarted = false; // true after "+New" — shows the draft row (and its rename field) before any notes are picked, so New reads as "start a song" not just "clear notes"

function openDrawer() {
  document.getElementById('sidebar-panel').classList.remove('collapsed');
  return refreshLibrary();
}

function toggleDrawer() {
  const panel = document.getElementById('sidebar-panel');
  const isOpen = !panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed', isOpen);
  if (!isOpen) refreshLibrary();
}

async function refreshLibrary() {
  librarySongs = await fetchSongs();
  libraryTrash = await fetchTrash();
  renderLibrary();
}

function parseSongFields(song) {
  const notes  = typeof song.notes === 'string' ? JSON.parse(song.notes) : song.notes;
  const scales = song.scales ? (typeof song.scales === 'string' ? JSON.parse(song.scales) : song.scales) : [];
  return { notes, scales };
}

function timeSince(iso) {
  const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (secs < 60) return 'just now';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

// Renders pinned-scale chips for a row. unpinFn is the exact onclick body to
// unpinCall(key) builds the exact onclick body for a chip's ✕ — active rows
// unpin against the live working set, saved-but-inactive rows unpin against
// that song's persisted scales, so the call differs per row type.
function renderNestedScales(keys, unpinCall) {
  if (!keys.length) return '';
  return `<div class="song-item-nested">` + keys.map(key => {
    const sep = key.indexOf(':');
    const root = +key.slice(0, sep);
    const scaleName = key.slice(sep + 1);
    return `
    <div class="song-item-nested-row" onclick="openScaleModal(${root},'${scaleName}')">
      <span class="nested-swatch"></span>
      <span class="nested-name">${noteName(root)} ${scaleName}</span>
      <span class="nested-type">scale</span>
      <span class="nested-unpin" onclick="event.stopPropagation();${unpinCall(key)}" title="Unpin">✕</span>
    </div>`;
  }).join('') + `</div>`;
}

// The active row's baseline is "what's actually saved" — anything live sel/
// pickedScales differs from that is unsaved, which is the only time Save
// needs to show at all.
let savedSnapshot = null;
function snapshotKey() {
  return JSON.stringify({ notes: [...sel].sort((a, b) => a - b), scales: [...pickedScales].sort() });
}
function isDirty() {
  return currentSong ? savedSnapshot !== snapshotKey() : sel.size > 0;
}

function renderLibrary() {
  const list = document.getElementById('drawer-list');
  if (!list) return;
  if (list.querySelector('.song-item-name-edit')) return; // don't clobber an in-progress rename

  if (librarySongs.length === 0 && libraryTrash.length === 0 && sel.size === 0) {
    list.innerHTML = '<div class="sidebar-empty">No saved songs yet.<br>Save a note set to see it here.</div>';
    return;
  }

  let html = '';
  const saveBtn = isDirty() ? `<button class="song-item-save" onclick="event.stopPropagation();saveActiveRow()">Save</button>` : '';
  // Double-clicking anywhere on an active row (not just the name) starts a
  // rename — a plain click no longer does, so it can't be triggered by accident.
  const dblclickRename = songId => `ondblclick="event.stopPropagation();startRenameActiveRow(this.querySelector('.song-item-name'), ${songId})"`;

  // In-progress draft with no saved song behind it yet — always sits on top.
  // Nothing to trash yet, so no trash button here.
  if (!currentSong && (sel.size > 0 || draftStarted)) {
    const pinned = [...pickedScales];
    const expanded = expandedSongs.has('draft');
    html += `
    <div class="song-item active-row" ${dblclickRename('null')}>
      ${pinned.length ? `<span class="song-item-chevron${expanded ? ' expanded' : ''}" onclick="event.stopPropagation();toggleSongExpand('draft')">▸</span>` : ''}
      <div class="song-item-body">
        <div class="song-item-name">${pendingSongName}</div>
      </div>
      ${saveBtn}
    </div>`;
    if (pinned.length && expanded) html += renderNestedScales(pinned, key => `unpinFromActiveRow('${key}')`);
  }

  for (const song of librarySongs) {
    const { scales } = parseSongFields(song);
    const date = new Date(song.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    if (currentSong && currentSong.id === song.id) {
      const pinned = [...pickedScales];
      const scaleLabel = pinned.length ? ` · ${pinned.length} scale${pinned.length > 1 ? 's' : ''}` : '';
      const expanded = expandedSongs.has(song.id);
      html += `
      <div class="song-item active-row" data-song-id="${song.id}" ${dblclickRename(song.id)}>
        ${pinned.length ? `<span class="song-item-chevron${expanded ? ' expanded' : ''}" onclick="event.stopPropagation();toggleSongExpand(${song.id})">▸</span>` : ''}
        <div class="song-item-body">
          <div class="song-item-name">${song.name}</div>
          <div class="song-item-meta">${date}${scaleLabel}</div>
        </div>
        ${saveBtn}
        <button class="song-item-trash-btn" onclick="event.stopPropagation();moveToTrash(${song.id})" title="Move to Trash">🗑</button>
      </div>`;
      if (pinned.length && expanded) html += renderNestedScales(pinned, key => `unpinFromActiveRow('${key}')`);
      continue;
    }

    const scaleLabel = scales.length ? ` · ${scales.length} scale${scales.length > 1 ? 's' : ''}` : '';
    const hasChildren = scales.length > 0;
    const expanded = expandedSongs.has(song.id);
    html += `
    <div class="song-item" data-song-id="${song.id}">
      ${hasChildren ? `<span class="song-item-chevron${expanded ? ' expanded' : ''}" onclick="event.stopPropagation();toggleSongExpand(${song.id})">▸</span>` : ''}
      <div class="song-item-body" onclick="loadSong(${song.id})">
        <div class="song-item-name">${song.name}</div>
        <div class="song-item-meta">${date}${scaleLabel}</div>
      </div>
      <button class="song-item-trash-btn" onclick="event.stopPropagation();moveToTrash(${song.id})" title="Move to Trash">🗑</button>
    </div>`;

    if (hasChildren && expanded) {
      html += renderNestedScales(scales, key => `unpinFromSong(${song.id},'${key}')`);
    }
  }

  if (libraryTrash.length > 0) {
    html += `<div class="library-trash-title">Trash<button class="library-empty-trash-btn" onclick="event.stopPropagation();emptyTrash()" title="Empty Trash">🗑</button></div>`;
    for (const song of libraryTrash) {
      html += `
      <div class="song-item trashed" data-song-id="${song.id}">
        <div class="song-item-body">
          <div class="song-item-name">${song.name}</div>
          <div class="song-item-meta">Deleted ${timeSince(song.trashed_at)}</div>
        </div>
        <button class="song-item-restore" onclick="event.stopPropagation();restoreFromTrashUI(${song.id})">Restore</button>
      </div>`;
    }
  }

  list.innerHTML = html || '<div class="sidebar-empty">No saved songs yet.<br>Save a note set to see it here.</div>';
}

function toggleSongExpand(id) {
  expandedSongs.has(id) ? expandedSongs.delete(id) : expandedSongs.add(id);
  renderLibrary();
}

// Unpins against the live working set (used by the active row, whether that's
// a loaded song or an unsaved draft) — persists immediately if there's a
// currentSong to persist to.
async function unpinFromActiveRow(key) {
  pickedScales.delete(key);
  analyze();
  if (currentSong) {
    await updateSong(currentSong.id, { scales: [...pickedScales] });
    const cached = librarySongs.find(s => s.id === currentSong.id);
    if (cached) cached.scales = [...pickedScales];
    savedSnapshot = snapshotKey();
  }
  renderLibrary();
}

function loadSong(id) {
  const song = librarySongs.find(s => s.id === id);
  if (!song) return;
  const { notes, scales } = parseSongFields(song);
  currentSong = { id: song.id, name: song.name };
  pendingSongName = 'Untitled';
  draftNameTyped = false;
  draftStarted = false;
  sel.clear();
  notes.forEach(n => sel.add(n));
  pickedScales.clear();
  scales.forEach(k => pickedScales.add(k));
  expandedSongs = scales.length ? new Set([song.id]) : new Set();
  savedSnapshot = snapshotKey();
  refreshButtons();
  analyze();
  renderLibrary();
  history.replaceState(null, '', `${location.pathname}${location.search}#song=${song.id}`);
}

// Reads #song=<id> on load and restores that song; strips the hash (without
// adding a history entry, like a permanent redirect) if it's malformed or the
// song no longer exists.
function restoreSongFromHash() {
  const m = location.hash.match(/^#song=(\d+)$/);
  const found = m ? librarySongs.some(s => s.id === +m[1]) : false;
  if (!found) {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    return;
  }
  loadSong(+m[1]);
}

async function moveToTrash(id) {
  await trashSong(id);
  if (currentSong && currentSong.id === id) {
    currentSong = null;
    history.replaceState(null, '', location.pathname + location.search);
  }
  await refreshLibrary();
}

async function restoreFromTrashUI(id) {
  await restoreSong(id);
  await refreshLibrary();
}

async function emptyTrash() {
  if (libraryTrash.length === 0) return;
  if (!confirm(`Permanently delete ${libraryTrash.length} song${libraryTrash.length > 1 ? 's' : ''} from Trash? This can't be undone.`)) return;
  await Promise.all(libraryTrash.map(s => deleteSong(s.id)));
  await refreshLibrary();
}

async function unpinFromSong(songId, key) {
  const song = librarySongs.find(s => s.id === songId);
  if (!song) return;
  const { scales } = parseSongFields(song);
  const updated = scales.filter(k => k !== key);
  await updateSong(songId, { scales: updated });
  if (currentSong && currentSong.id === songId) {
    pickedScales.delete(key);
    analyze();
  }
  await refreshLibrary();
}

// Click-to-rename: swaps the row's name for an input, focused immediately.
// songId null means "this is the unsaved draft" — commits to pendingSongName
// locally instead of hitting the API (nothing exists to rename yet).
// andSave means this rename exists only to unblock a Save click that was
// refused for an untyped name — finish that save however the rename ends
// (blur is the common case; Enter still works too), not just on Enter.
function startRenameActiveRow(nameEl, songId, andSave = false) {
  const current = nameEl.textContent;
  const input = document.createElement('input');
  input.className = 'song-item-name-edit';
  input.value = current === 'Untitled' ? '' : current;
  input.placeholder = 'Untitled';
  nameEl.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if (committed) return;
    committed = true;
    const typed = input.value.trim();
    const val = typed || 'Untitled';
    input.remove(); // renderLibrary() refuses to run while this input is still in the DOM
    if (songId) {
      const updated = await updateSong(songId, { name: val });
      if (currentSong && currentSong.id === songId) currentSong.name = updated.name;
      await refreshLibrary();
    } else {
      pendingSongName = val;
      if (typed) draftNameTyped = true; // an untouched blur still defaults to 'Untitled' but doesn't count as naming it
      renderLibrary();
      if (andSave && typed) await saveActiveRow();
    }
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    // andSave's draft case already saves from inside commit() above — chaining
    // saveActiveRow here too would fire a second, redundant save call.
    if (ev.key === 'Enter') { if (songId === null && andSave) commit(); else commit().then(saveActiveRow); }
  });
}

async function saveActiveRow() {
  if (sel.size === 0) return;
  if (currentSong) {
    const updated = await updateSong(currentSong.id, { notes: [...sel], scales: [...pickedScales] });
    currentSong.name = updated.name;
    savedSnapshot = snapshotKey();
    await refreshLibrary();
    return;
  }
  if (!draftNameTyped) {
    // Refuse to save the untouched "Untitled" placeholder — force a real
    // name first, then re-run this same save once it's committed.
    const nameEl = document.querySelector('#drawer-list .song-item.active-row .song-item-name');
    if (nameEl) startRenameActiveRow(nameEl, null, true);
    return;
  }
  const saved = await saveSong(pendingSongName, [...sel], [...pickedScales]);
  currentSong = { id: saved.id, name: saved.name };
  // The draft's accordion state was tracked under the 'draft' key — carry it
  // over to the song's real id so saving doesn't visually collapse it.
  if (expandedSongs.has('draft')) { expandedSongs.delete('draft'); expandedSongs.add(saved.id); }
  history.replaceState(null, '', `${location.pathname}${location.search}#song=${saved.id}`);
  savedSnapshot = snapshotKey();
  await refreshLibrary();
}

// + menu (New / Import)
function togglePlusMenu() {
  const menu = document.getElementById('plus-menu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', e => {
  if (!e.target.closest('#btn-plus, #plus-menu')) document.getElementById('plus-menu').style.display = 'none';
});
document.getElementById('menu-new-item').addEventListener('click', () => {
  document.getElementById('plus-menu').style.display = 'none';
  startNewSong();
});

refreshLibrary().then(restoreSongFromHash);

// ── INIT ─────────────────────────────────────────────────────────────────────

buildNoteGrid();

(function populateFretPicker() {
  const select = document.getElementById('modal-fretpick');
  for (let f = 0; f <= 24; f++) {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f === 0 ? 'Open' : f;
    select.appendChild(opt);
  }
})();
syncInstrumentButtons(); // reflect the default immediately; settings may override below

fetchSettings().then(s => {
  if (s.instrument === 'guitar' || s.instrument === 'bass') {
    instrument = s.instrument;
  }
  syncInstrumentButtons();
  if (s.resultsView === 'chords') {
    resultsView = 'chords';
    document.querySelectorAll('.results-view-btn').forEach(b => b.classList.toggle('on', b.dataset.view === 'chords'));
  }
  if (s.scaleView === 'position') {
    modalView = 'position';
  }
  if (s.useFlats === '1') {
    useFlats = true;
    document.getElementById('acc-sharp').classList.remove('on');
    document.getElementById('acc-flat').classList.add('on');
    document.querySelectorAll('#note-grid .note-btn').forEach(b => {
      b.innerHTML = `<span class="nn">${noteName(+b.dataset.i)}</span>`;
    });
    analyze();
  } else {
    document.getElementById('acc-sharp').classList.add('on');
  }
  if (s.theme === 'light') setTheme('light');
  else setTheme('dark');
}).catch(() => {});
</script>
</div><!-- /main-content -->
</div><!-- /app-layout -->
